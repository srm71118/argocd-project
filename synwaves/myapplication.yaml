apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: my-app-ns
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  APP_NAME: "My Demo App"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: my-app-sa-1
  namespace: my-app-ns
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: v1
kind: Namespace
metadata:
  name: my-app-ns
  labels:
    area: my-app-ns
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: my-app-sa-2
  namespace: my-app-ns
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: v1
kind: Secret
metadata:
  name: my-app-secrets
  namespace: my-app-ns
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
data:
  DB_ROOT_PASSWORD: cGFzc3dvcmQ=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  namespace: my-app-ns
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      serviceAccountName: my-app-sa-2
      containers:
        - name: boxone
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: my-app-secrets
                  key: DB_ROOT_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: my-app-service
  namespace: my-app-ns
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    app: my-app
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
  type: ClusterIP

